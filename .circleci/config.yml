version: 2.1

jobs:
  validate_Rollout_Suite6:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: presto
          command: |
            mkdir -p /tmp/workspace
            { set +o pipefail 2>/dev/null; printf "a b c d e f g h\n" | awk '{for(i=NF;i>=1;i--)printf "%s ",$i; print ""}'; true ; } > /tmp/workspace/handoff.sig
            echo "gate Rollout_Suite6: $(wc -c </tmp/workspace/handoff.sig) bytes total"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - handoff.sig
  Rollout_Suite6:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load upstream state
          command: |
            cat /tmp/workspace/handoff.sig
      - run:
          name: Grab main branch
          command: git clone --depth 3 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack cached data
          command: tar --extract --file=content.tar
      - run:
          no_output_timeout: 71m
          command: (./controller)
